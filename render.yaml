services:
  - type: web
    name: beidi-ordering
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "3000"
      - key: SUDA_DATABASE_URL
        fromDatabase:
          name: beidi-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: beidi-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Beidi@2025
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: beidi-db
    databaseName: beidi
    user: beidi
    plan: free
    region: singapore
    postgresMajorVersion: "16"
